name: Deploy Swift Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Swift exporter and generate dist
        run: |
          swiftc -O -DSTATIC_EXPORT_ONLY \
            Sources/Portfolio/Models/PortfolioModels.swift \
            Sources/Portfolio/Services/ContentStore.swift \
            Sources/Portfolio/Views/HTMLRenderer.swift \
            Sources/Portfolio/Services/StaticSiteExporter.swift \
            Sources/Portfolio/entrypoint.swift \
            -o portfolio-export
          ./portfolio-export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
